name: "CodeQL Analysis with Remote Queries"
description: "Composite action to run CodeQL analysis with remote queries"

inputs: {}
outputs: {}

runs:
  using: "composite"
  steps:
    # Step 1: Checkout the code of the current repository to be analyzed
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 2: Checkout the remote repository containing your CodeQL queries
    # and place them in a specific directory (e.g., 'codeql-queries-repo')
    - name: Checkout custom CodeQL queries
      uses: actions/checkout@v4
      with:
        repository: prg-titech/guardql # <-- Specify your query repository here
        path: ./.github/codeql-queries   # <-- Specify a local path to place the queries

    # Step 3: Initialize CodeQL, pointing to the local path
    # where the remote queries were checked out.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: 'cpp'
        # The path here now refers to the directory created in the step above
        queries: ./.github/codeql-queries/codeql-custom-queries-cpp # <-- Point to the pack within the checked-out repo

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3